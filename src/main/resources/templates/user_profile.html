       progress >= 90 ? '🟢🟢🟢🟢🟢🟢🟢' :
       progress >= 80 ? '🟡🟡🟡🟡🟡🟡' :
       progress >= 70 ? '🟡🟡🟡🟡🟡' :
       progress >= 50 ? '🟡🟡🟡🟡' :
       progress >= 40 ? '🟠🟠🟠🟠' :
       progress >= 30 ? '🟠🟠🟠' :
       progress >= 20 ? '🟠🟠' :
       progress >= 10 ? '🔴🔴' :
       '🔴')}">
    25.0% 🔴🔴
</b>
