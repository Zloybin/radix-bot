<table bordered striped compact>
    <tr>
        <th colspan="9" align="center">Страйки</th>
    </tr>
    <!-- Дни недели -->
    <tr>
        <td align="center"
            th:each="strike : ${strikeInfoList}"
            th:text="${strike.day}">
            Пн
        </td>
        <td align="center">Тек</td>
        <td align="center">🏆</td>
    </tr>
    <!-- Статусы -->
    <tr>
        <td align="center"
            th:each="strike : ${strikeInfoList}"
            th:text="${strike.taskStatus.name() == 'COMPLETED'} ? '🔥' : (${strike.taskStatus.name() == 'NOT_COMPLETED'} ? '🧊' : ' ')">
        </td>
        <td align="center">
            <b th:text="${actualStrikeValue}">17</b>
        </td>
        <td align="center">
            <b th:text="${bestStrikeValue}">25</b>
        </td>
    </tr>
</table>

<hr/>

👋 Привет,
<b><th:block th:text="${firstname}">Имя</th:block>
    <th:block th:text="${lastname}">Фамилия</th:block>!</b>

<br/>
<hr/>

<br/>
<summary>🗓️ Сегодня:</summary>

<ul>
    <li th:each="task : ${dailyTaskInfoList}">
        <input type="checkbox"
               th:checked="${task.taskStatus.name() == 'COMPLETED'}"/>
        <th:block th:utext="${task.taskDescription}">
            Задача
        </th:block>
    </li>
</ul>
