<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouGlish Test</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #f0f2f5;
            font-family: system-ui;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;

            padding: 10px 20px;
        }

        h1 {
            text-align: center;
            margin: 5px 0 10px;
            flex-shrink: 0;
        }

        #widget-1 {
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .powered-by {
            text-align: center;
            margin: 8px 0 0;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 id="word">Загрузка...</h1>

    <div id="widget-1"></div>

    <p class="powered-by">
        Powered by
        <a href="https://youglish.com" target="_blank">
            YouGlish.com
        </a>
    </p>

</div>

<script>

    // Получаем word из URL
    const params = new URLSearchParams(window.location.search);
    const word = params.get("word") || "hello";

    document.getElementById("word").textContent = "🎯 " + word;


    function onYouglishAPIReady() {

        console.log("YouGlish API готов");

        const widget = new YG.Widget("widget-1", {

            width: "100%",

            // Высота будет соответствовать доступному пространству
            height: window.innerHeight - 100,

            components: 255,

            events: {

                onPlayerReady: function () {
                    console.log("YouGlish player ready");
                },

                onFetchDone: function (event) {
                    console.log("Fetch done:", event);
                },

                onError: function (event) {
                    console.error("YouGlish error:", event);
                }

            }

        });

        widget.fetch(word, "german");
    }

</script>

<script
        src="https://youglish.com/public/emb/widget.js"
        async
        charset="utf-8">
</script>

</body>
</html>
