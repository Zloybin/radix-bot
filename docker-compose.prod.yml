  # ==========================================
  # Spring Boot application + Telegram Bot
  # ==========================================

  app:
    extra_hosts:
      - ${ANKI_BASE_URL}

    build:
      context: .
      dockerfile: Dockerfile

    container_name: java-demo
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      webapp:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: ${POSTGRESQL_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRESQL_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRESQL_DB_PASSWORD}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

    networks:
      - demo-network


