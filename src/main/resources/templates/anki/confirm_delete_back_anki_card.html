<h3>📝 Вопрос</h3>

<blockquote expandable th:utext="${question}">
    Текст вопроса
</blockquote>


<table>
    <tr>
        <td align="left">
            <b>Карты:</b>
            🆕 <b th:text="${newCount}">12</b>
            🔄 <b th:text="${reviewCount}">37</b>
            📖 <b th:text="${learnCount}">5</b>
        </td>

        <td align="right">
            <b th:text="${flag}">🇩🇪</b>
        </td>
    </tr>
</table>

<hr/>

<footer th:if="${tags != null and !tags.isEmpty()}">

    🏷 <b>Теги:</b>
    <i th:text="${#strings.listJoin(tags, ', ')}">
        physics, mechanics
    </i>

    <hr/>
</footer>

<h3>💡 Ответ</h3>

<blockquote >
    <br/>
    <th:block th:utext="${answer}">
        Ответ на вопрос
    </th:block>
    <br/>
    <br/>
</blockquote>

    ⚠️Вы уверены что хотит удалить эту карточку?
