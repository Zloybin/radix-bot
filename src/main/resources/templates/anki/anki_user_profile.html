<h3>📚 Статистика колод</h3>

<table bordered striped compact>
    <tr>
        <th>Колода</th>
        <th>Пройдено</th>
        <th>Осталось</th>
        <th>Страйк</th>
    </tr>

    <tr th:each="deck : ${ankiMenuDeckInfoList}">
        <td>
            <b th:text="${deck.deckName}">Java</b>
        </td>

        <td align="center">
            <b th:text="${deck.reviewedCardCount}">25</b>
        </td>

        <td align="center">
            <b th:text="${deck.uncompletedCardCount}">10</b>
        </td>

        <td align="center">
            🔥 <b th:text="${deck.deckStrike}">7</b>
        </td>
    </tr>
</table>

<hr/>
