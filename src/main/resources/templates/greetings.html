<table bordered striped compact>
    <tr>
        <th colspan="9" align="center">Страйки</th>
    </tr>
    <tr>
        <td align="center"
            th:each="strike : ${strikeListTemplateDate}"
            th:text="${strike.dayName}">
        </td>
        <td align="center">Тек</td>
        <td align="center">🏆</td>
    </tr>
    <tr>
        <td align="center"
            th:each="strike : ${strikeListTemplateDate}"
            th:text="${strike.isCompleted == null} ? ' ' : (${strike.isCompleted} ? '🔥' : '🧊')">
        </td>
        <td align="center">17</td>
        <td align="center">25</td>
    </tr>
</table>

<summary>🗓️ Прогресс за сегодня:</summary>
<table bordered striped compact>
    <tr>
        <td rowspan="2" align="left">Anki 🧠</td>
        <td align="center" th:each="deck : ${deckListTemplateDate}" th:text="${deck.deckName}"></td>
    </tr>
    <tr>
        <td align="center" th:each="deck : ${deckListTemplateDate}" th:text="${deck.isSuccesses} ? '✅' : '❌'"></td>
    </tr>
</table>

<table bordered striped compact>
    <tr>
        <td rowspan="2">Задачи ⚛️</td>
        <td align="center">🆕</td>
        <td align="center">🔄</td>
        <td align="center"></td>
    </tr>
    <tr>
        <td align="center">0</td>
        <td align="center"><th:block th:text="${completedPhysTaskCount}">0</th:block></td>
        <td align="center"><b th:text="${isPhysTaskCompleted} ? '✅' : '❌'">✅</b></td>
    </tr>
</table>

<table bordered striped compact>
    <tr>
        <td rowspan="2">DuoCards 🇩🇪</td>
        <td align="center">✏️</td>
        <td align="center"></td>
    </tr>
    <tr>
        <td align="center"><th:block th:text="${completedDuoCardsSentenceTaskCount}">10</th:block></td>
        <td align="center"><b th:text="${isDuoCardsSentenceTaskCompleted} ? '✅' : '❌'">✅</b></td>
    </tr>
</table>
