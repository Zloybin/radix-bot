<script>
    const params = new URLSearchParams(window.location.search);
    const word = params.get("word") || "Hallo";

    document.getElementById("word").textContent = "🎯 " + word;

    function onYouglishAPIReady() {
        console.log("YouGlish API готов");

        const widget = new YG.Widget("widget-1", {
            width: 640,
            height: 400,
            components: 255,

            events: {
                onPlayerReady: function () {
                    console.log("YouGlish player ready");
                },

                onFetchDone: function (event) {
                    console.log("Fetch done:", event);
                },

                onError: function (event) {
                    console.error("YouGlish error:", event);
                }
            }
        });

        widget.fetch(word, "german");
    }
</script>

<script
        src="https://youglish.com/public/emb/widget.js"
        async
        charset="utf-8">
</script>
